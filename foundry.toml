[profile.default]
src = "assets/erc-asf/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "asf/=assets/erc-asf/contracts/",
]
fs_permissions = [
  { access = "read", path = "./assets/erc-asf/vectors" },
  { access = "read", path = "./assets/erc-asf/examples" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
